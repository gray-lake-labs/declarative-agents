# Tracked target pin per parent repository (parent design.yaml
# external_references). Every derived_from entry in this corpus is validated
# against a release of its parent; this file names the release the corpus
# currently tracks. The parent-upgrade workflow moves it, converts and
# formats the corpus with the new release, and has a person re-pin the
# entries whose cited text changed (docs/guides/parent-upgrade.md).
#
# v0.20261016.1 is the first Nokia release whose corpus is Markdown (its
# eng10); this corpus converted with it (GH-211). v0.20261017.1 declares
# every field a document may hold, and this corpus moved onto those fields
# (GH-219).
pins:
  github.com/Nokia-Bell-Labs/declarative-agents: v0.20261017.2
