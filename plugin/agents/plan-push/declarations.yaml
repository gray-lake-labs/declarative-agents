# The plan-push machine's words (GH-206, srd031 R4.7): the milestone, the
# sprint issue, the sprint-end issues, and the planned events. Each word
# rereads the road map in the checkout and recomputes its scope, and each
# upserts by marker or ensures by title, so a re-run of any word — or of
# the whole machine — updates and creates nothing. TPM_SYSTEM, TPM_VERSION,
# and TPM_END come from the environment; TPM_REF defaults to main.
unit: tpm-plan-push-declarations
tools:
- name: tpm_plan_milestone
  type: exec
  binary: tpm
  args:
  - plan
  - milestone
  - --json
  - --system
  - ${TPM_SYSTEM}
  - --version
  - ${TPM_VERSION}
  - --end
  - ${TPM_END}
  - --ref
  - ${TPM_REF:-main}
  visibility: internal
  description: Date the release's milestone in the program group and each releasing repository's group outside it (srd031 R4.2).
  category: boundary
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: The word's JSON report.
    schema:
      type: string
  side_effects:
  - kind: external_api_call
    target: tracker
    description: Creates or updates the milestone in every group it serves.
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: Every push word upserts, so a re-run updates and creates nothing.
  errors:
  - signal: CommandError
    condition: the tpm binary cannot be started or an environment variable is unset
    message_shape: 'tpm_plan_milestone: <error>'
    state_after_failure: nothing ran in a process that did not start
  - signal: ToolFailed
    condition: the road map names no such release, its publication has no milestone or tag, or tpm exits non-zero
    message_shape: <tpm's refusal reason, as printed>
    state_after_failure: what the earlier words pushed stands; a re-run of the push finishes it

- name: tpm_plan_sprint_issue
  type: exec
  binary: tpm
  args:
  - plan
  - sprint-issue
  - --json
  - --system
  - ${TPM_SYSTEM}
  - --version
  - ${TPM_VERSION}
  - --end
  - ${TPM_END}
  - --ref
  - ${TPM_REF:-main}
  visibility: internal
  description: Keep the release's one sprint issue with its exit checklist, found by its marker; a ticked item stays ticked (srd001 R7).
  category: boundary
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: The word's JSON report.
    schema:
      type: string
  side_effects:
  - kind: external_api_call
    target: tracker
    description: Files or updates the sprint issue in the system repository.
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: Every push word upserts, so a re-run updates and creates nothing.
  errors:
  - signal: CommandError
    condition: the tpm binary cannot be started or an environment variable is unset
    message_shape: 'tpm_plan_sprint_issue: <error>'
    state_after_failure: nothing ran in a process that did not start
  - signal: ToolFailed
    condition: the sprint issue cannot be filed or updated and tpm exits non-zero
    message_shape: <tpm's refusal reason, as printed>
    state_after_failure: what the earlier words pushed stands; a re-run of the push finishes it

- name: tpm_plan_sprint_ends
  type: exec
  binary: tpm
  args:
  - plan
  - sprint-ends
  - --json
  - --system
  - ${TPM_SYSTEM}
  - --version
  - ${TPM_VERSION}
  - --end
  - ${TPM_END}
  - --ref
  - ${TPM_REF:-main}
  visibility: internal
  description: Keep one sprint-end issue per releasing repository, each found by its marker (srd038 R1.1).
  category: boundary
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: The word's JSON report.
    schema:
      type: string
  side_effects:
  - kind: external_api_call
    target: tracker
    description: Files or updates the sprint-end issues in the releasing repositories.
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: Every push word upserts, so a re-run updates and creates nothing.
  errors:
  - signal: CommandError
    condition: the tpm binary cannot be started or an environment variable is unset
    message_shape: 'tpm_plan_sprint_ends: <error>'
    state_after_failure: nothing ran in a process that did not start
  - signal: ToolFailed
    condition: a sprint-end issue cannot be filed or updated and tpm exits non-zero
    message_shape: <tpm's refusal reason, as printed>
    state_after_failure: what the earlier words pushed stands; a re-run of the push finishes it

- name: tpm_plan_events
  type: exec
  binary: tpm
  args:
  - plan
  - events
  - --json
  - --system
  - ${TPM_SYSTEM}
  - --version
  - ${TPM_VERSION}
  - --end
  - ${TPM_END}
  - --ref
  - ${TPM_REF:-main}
  visibility: internal
  description: Post a planned event on each open Sprint Goal the release moves, once (srd031 R4.3).
  category: boundary
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: The word's JSON report.
    schema:
      type: string
  side_effects:
  - kind: external_api_call
    target: tracker
    description: Posts planned events on the Sprint Goals' ledgers.
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: Every push word upserts, so a re-run updates and creates nothing.
  errors:
  - signal: CommandError
    condition: the tpm binary cannot be started or an environment variable is unset
    message_shape: 'tpm_plan_events: <error>'
    state_after_failure: nothing ran in a process that did not start
  - signal: ToolFailed
    condition: an event cannot be posted and tpm exits non-zero
    message_shape: <tpm's refusal reason, as printed>
    state_after_failure: what the earlier words pushed stands; a re-run of the push finishes it
