# Tool selection for the tasks workflow. The words and file words are
# model-invoked in the Decompose state via $tool dispatch (design.md D10, D14).
tools:
  # words -- model-invoked
  - goals_plan
  - goals_push
  - backlog_list
  - issue_list
  - issue_file

  # File words
  - read
  - write
  - edit
  - find
  - list_files

  # Model loop -- direct transition actions
  - invoke_llm
  - parse_response
  - report_parse_error
  - reset_history
  - nudge_reread

  # Completion -- emits TaskCompleted via parse_response
  - done
