# The peer-read machine's words (GH-37). TPM_PROJECT and TPM_ISSUE name the release issue; optional flags are
# parameters from the run's request, never ${VAR} args (GH-135).
unit: scrum-master-peer-read-declarations
tools:
- name: release_approve
  type: exec
  binary: scrum-master
  args:
  - release
  - approve
  - --json
  - --project
  - ${TPM_PROJECT}
  - --issue
  - ${TPM_ISSUE}
  visibility: internal
  description: 'Record the reviewer''s peer read on the release issue (srd015 R1.2).'
  category: boundary
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: 'The peer read''s JSON report.'
    schema:
      type: string
  side_effects:
  - kind: external_api_call
    target: tracker
    description: 'Posts the peer-read comment on the release issue.'
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: The word's write is a person's to reverse with the tracker.
  errors:
  - signal: CommandError
    condition: the word cannot start — this agent does not serve the scrum-master words — or an environment variable is unset
    message_shape: 'release_approve: <error>'
    state_after_failure: nothing ran in a word that did not start
  - signal: ToolFailed
    condition: the word refuses and exits non-zero
    message_shape: <the word's reason, as printed>
    state_after_failure: the tracker is as the word's refusal left it
