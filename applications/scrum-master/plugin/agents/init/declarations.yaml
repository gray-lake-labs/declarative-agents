# The init machine's words (GH-29): lay down the system repository and
# install its skills, then vendor the profiles. Optional flags are
# parameters from the run's request, never ${VAR} args (GH-135).
unit: tpm-init-declarations
tools:
- name: tpm_init
  type: exec
  binary: tpm
  args:
  - init
  - --json
  visibility: internal
  description: Lay down the program's system repository — corpus, control files, orientation — and install the skills for the named agents (srd034, srd037); a rerun changes only what drifted.
  category: boundary
  parameters:
    type: object
    properties:
      agent:
        type: string
        description: The agents whose skills install, cursor, claude, copilot, or all.
        flag: --agent
        default: all
      tracker:
        type: string
        description: A tracker repository to seed when it has no commits.
        flag: --tracker
      group:
        type: string
        description: The program group whose labels the tracker gets.
        flag: --group
      prefix:
        type: string
        description: The issue ID prefix the tracker gets.
        flag: --prefix
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: tpm init's JSON report — every file it wrote or kept, the skills, and the tracker.
    schema:
      type: string
  side_effects:
  - kind: filesystem_write
    target: repository
    description: Writes the corpus, the control files, the orientation files, and the skills; an edited file is kept.
  - kind: external_api_call
    target: tracker
    description: Seeds the tracker repository when one is named and empty.
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: The files are the person's to commit or discard.
  errors:
  - signal: CommandError
    condition: the tpm binary cannot be started
    message_shape: 'tpm_init: <error>'
    state_after_failure: nothing written by a process that did not start
  - signal: ToolFailed
    condition: tpm refuses the init and exits non-zero
    message_shape: <tpm's reason, as printed>
    state_after_failure: the repository is as tpm's refusal left it

- name: tpm_vendor
  type: exec
  binary: tpm
  args:
  - install
  - --profiles
  - --json
  visibility: internal
  description: Vendor the release's profiles and agent-core declarations into .scrum-master, which the installed skills run, and report what drifted (GH-29).
  category: boundary
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: The vendoring's JSON report — the release and each file's action, created, updated, unchanged, kept, or removed.
    schema:
      type: string
  side_effects:
  - kind: filesystem_write
    target: repository
    description: Writes .scrum-master/agents, .scrum-master/agent-core/tools, and .scrum-master/manifest.json; an edited file is kept.
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: The vendored tree is the person's to commit or discard; a rerun rewrites what nobody edited.
  errors:
  - signal: CommandError
    condition: the tpm binary cannot be started
    message_shape: 'tpm_vendor: <error>'
    state_after_failure: nothing written by a process that did not start
  - signal: ToolFailed
    condition: the release's source is not on this host, or a write fails
    message_shape: <tpm's reason, as printed>
    state_after_failure: the repository is laid down; a rerun vendors what is missing
