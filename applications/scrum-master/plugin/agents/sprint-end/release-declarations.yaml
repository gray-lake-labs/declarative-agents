# The release words of the sprint-end workflow: the merge that delivers its issue, the
# release gate, and the tag. Kept apart from declarations.yaml, which holds
# the workflow's own words, so neither file outgrows the declaration-style
# limit. Optional flags are parameters, never ${VAR} args (GH-135).
unit: tpm-sprint-end-release-declarations
tools:
- name: tpm_issue_merge
  type: exec
  binary: scrum-master
  args:
  - issue
  - merge
  - --json
  visibility: external
  description: Deliver the sprint-end issue by the merge that closes it and the complete Sprint Goals (srd013 R5.5, srd038).
  category: boundary
  parameters:
    type: object
    properties:
      project:
        type: string
        description: Project path.
        flag: --project
      issue:
        type: integer
        description: Issue IID.
        flag: --issue
      closes:
        type: string
        description: Another issue the merge closes, project#iid.
        flag: --closes
      control:
        type: string
        description: Program repository holding control/ files.
        flag: --control
      dir:
        type: string
        description: The worktree holding the branch, where the audit runs.
        flag: --dir
    required: [project, issue]
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: tpm issue merge's JSON report.
    schema:
      type: string
  side_effects:
  - kind: external_api_call
    target: tracker
    description: Merges the branch, pushes the result, and closes the issues in the tracker.
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: tpm's own policy governs what follows; the run reverses nothing.
  errors:
  - signal: CommandError
    condition: the word cannot start — this agent does not serve the scrum-master words
    message_shape: 'tpm_issue_merge: <error>'
    state_after_failure: nothing ran in a process that did not start
  - signal: ToolFailed
    condition: tpm refuses the merge — a failed audit or a missing approval — and exits non-zero
    message_shape: <tpm's refusal reason, as printed>
    state_after_failure: the tracker and the checkout are as tpm's refusal left them

- name: tpm_release_gate
  type: exec
  binary: scrum-master
  args:
  - release
  - gate
  - --json
  visibility: external
  description: Run the release gate for the confirmed version (srd015, srd038 R6).
  category: boundary
  parameters:
    type: object
    properties:
      artifact:
        type: string
        description: Artifact a subsystem SRD declares.
        flag: --artifact
      version:
        type: string
        description: Candidate version.
        flag: --version
      issue:
        type: string
        description: Release issue as project#iid.
        flag: --issue
      control:
        type: string
        description: Program repository holding control/policy.md.
        flag: --control
      dir:
        type: string
        description: The artifact repository's local checkout.
        flag: --dir
    required: [artifact, version, issue]
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: tpm release gate's JSON report.
    schema:
      type: string
  side_effects:
  - kind: external_api_call
    target: tracker
    description: Runs the gates and records evidence events on the release issue.
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: tpm's own policy governs what follows; the run reverses nothing.
  errors:
  - signal: CommandError
    condition: the word cannot start — this agent does not serve the scrum-master words
    message_shape: 'tpm_release_gate: <error>'
    state_after_failure: nothing ran in a process that did not start
  - signal: ToolFailed
    condition: a gate fails or tpm refuses, exiting non-zero
    message_shape: <tpm's refusal reason, as printed>
    state_after_failure: the tracker and the checkout are as tpm's refusal left them

- name: tpm_release_tag
  type: exec
  binary: scrum-master
  args:
  - release
  - tag
  - --json
  visibility: external
  description: Tag the confirmed release once its gate passed (srd015, srd038 R6).
  category: boundary
  parameters:
    type: object
    properties:
      artifact:
        type: string
        description: Artifact a subsystem SRD declares.
        flag: --artifact
      version:
        type: string
        description: Candidate version.
        flag: --version
      issue:
        type: string
        description: Release issue as project#iid.
        flag: --issue
      control:
        type: string
        description: Program repository holding control/policy.md.
        flag: --control
      dir:
        type: string
        description: The artifact repository's local checkout.
        flag: --dir
    required: [artifact, version, issue]
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: tpm release tag's JSON report.
    schema:
      type: string
  side_effects:
  - kind: external_api_call
    target: tracker
    description: Pushes the release tag.
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: tpm's own policy governs what follows; the run reverses nothing.
  errors:
  - signal: CommandError
    condition: the word cannot start — this agent does not serve the scrum-master words
    message_shape: 'tpm_release_tag: <error>'
    state_after_failure: nothing ran in a process that did not start
  - signal: ToolFailed
    condition: tpm refuses the tag — no passing gate, or the version exists — and exits non-zero
    message_shape: <tpm's refusal reason, as printed>
    state_after_failure: the tracker and the checkout are as tpm's refusal left them
