# Tool selection for the implement workflow. The tpm words and git_push are
# machine actions the model never dispatches; the file and git words are
# model-invoked in the Work state via $tool dispatch (design.md D10).
tools:
  # Workflow words -- direct transition actions, never model-dispatched
  - tpm_issue_pop
  - git_push
  - tpm_issue_merge

  # File words -- model-invoked via $tool dispatch in Work
  - read
  - write
  - edit
  - find
  - list_files

  # Commit words -- model-invoked: each issue commits separately
  - stage_all
  - commit

  # Model loop -- direct transition actions
  - invoke_llm
  - parse_response
  - report_parse_error
  - reset_history
  - nudge_reread

  # Completion -- emits TaskCompleted via parse_response
  - done
