# The merge machine's words (GH-201, srd013 R5.7): the gate that writes
# nothing, the merge word, and the close word. The commit and the closes
# flow from the merge word's JSON output into the close word's parameters —
# the runtime extracts a declared parameter from the previous result — so
# nothing is retyped between steps. TPM_PROJECT and TPM_ISSUE come from the
# environment; an optional value is a parameter, never a ${VAR} arg (the
# GH-135 finding).
unit: tpm-merge-declarations
tools:
- name: tpm_merge_gate
  type: exec
  binary: tpm
  args:
  - issue
  - merge
  - --dry-run
  - --json
  - --project
  - ${TPM_PROJECT}
  - --issue
  - ${TPM_ISSUE}
  visibility: internal
  description: Run every delivery gate and write nothing — the issue and closes open, commits over the base, the summary format, the audit on a docs/ change, the approval the policy requires (srd013 R5.3, R5.5).
  category: boundary
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: tpm issue merge --dry-run's JSON report of what would merge.
    schema:
      type: string
  side_effects:
  - kind: filesystem_read
    target: worktree
    description: Reads the branch, the diff, and the control files; the audit command runs read-only over the worktree.
  reversibility:
    classification: reversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: A dry run changes nothing.
  errors:
  - signal: CommandError
    condition: the tpm binary cannot be started or an environment variable is unset
    message_shape: 'tpm_merge_gate: <error>'
    state_after_failure: nothing ran in a process that did not start
  - signal: ToolFailed
    condition: a gate refuses — a failed audit, a missing approval, a closed issue, a branch with nothing over the base — and tpm exits non-zero
    message_shape: <tpm's refusal reason, as printed>
    state_after_failure: nothing merged; the worktree and the tracker are unchanged

- name: tpm_merge_branch
  type: exec
  binary: tpm
  args:
  - issue
  - merge-branch
  - --json
  - --project
  - ${TPM_PROJECT}
  - --issue
  - ${TPM_ISSUE}
  visibility: internal
  description: Merge the branch --no-ff into the default branch with a message citing the issue and each closes, and push it; close nothing (GH-201, srd013 R5.7).
  category: boundary
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: The merge word's JSON report — the commit and, as closes, what close-delivered takes next.
    schema:
      type: string
  side_effects:
  - kind: external_api_call
    target: git_remote
    description: Makes the merge commit in the main checkout and pushes the default branch.
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: A pushed merge stays; a re-run finds the branch already merged and makes no second commit.
  errors:
  - signal: CommandError
    condition: the tpm binary cannot be started or an environment variable is unset
    message_shape: 'tpm_merge_branch: <error>'
    state_after_failure: nothing merged by a process that did not start
  - signal: ToolFailed
    condition: tpm refuses the merge and exits non-zero
    message_shape: <tpm's refusal reason, as printed>
    state_after_failure: the branch and the default branch are as the refusal left them

- name: tpm_close_delivered
  type: exec
  binary: tpm
  args:
  - issue
  - close-delivered
  - --json
  - --project
  - ${TPM_PROJECT}
  - --issue
  - ${TPM_ISSUE}
  visibility: internal
  description: Close the issue and each closes reference on the merge commit, and report complete each closed Sprint Goal (GH-201, srd013 R5.7, srd038 R2.2).
  category: boundary
  parameters:
    type: object
    properties:
      commit:
        type: string
        description: The merge commit the merge word reported.
        flag: --commit
        source: $from(deliver).commit
      closes:
        type: string
        description: The other issues the merge closes, comma-separated, from the merge word's output.
        flag: --closes
        source: $from(deliver).closes
    required: [commit]
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: The close word's JSON report — what closed and what was reported complete.
    schema:
      type: string
  side_effects:
  - kind: external_api_call
    target: tracker
    description: Closes each issue on the commit and posts reported_complete events.
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: A re-run changes nothing; a closed issue stays closed on its commit.
  errors:
  - signal: CommandError
    condition: the tpm binary cannot be started or the commit parameter is missing
    message_shape: 'tpm_close_delivered: <error>'
    state_after_failure: nothing closed by a process that did not start
  - signal: ToolFailed
    condition: a close does not land and tpm exits non-zero
    message_shape: 'merged <commit>, but <reference> did not close: <reason>'
    state_after_failure: the merge stands; a re-run with the same commit finishes the delivery
