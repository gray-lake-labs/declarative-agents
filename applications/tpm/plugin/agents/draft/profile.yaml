# The draft skill as a declarative-agents profile (GH-198, design.md D14):
# the drafting conversation around tpm's hierarchy survey and check.
# tpm install renders the SKILL.md from this machine, and mage audit
# validates the profile at the pin.
name: draft
machine: machine.yaml
tools:
  - tools.yaml
tool_config_dirs:
  - /opt/agent-core/tools/builtin/filesystem
tool_declarations:
  - declarations.yaml
  - llm/default.yaml
  - /opt/agent-core/tools/builtin/report-parse-error.yaml
  - /opt/agent-core/tools/builtin/reset-history.yaml
  - /opt/agent-core/tools/builtin/nudge-reread.yaml
  - /opt/agent-core/tools/builtin/done.yaml
# The provider library invoke_llm reads its chat dialect from.
libraries:
  providers: /opt/agent-core/tools/providers/ollama
