# Tool selection for the draft workflow. The tpm words and file words are
# model-invoked in the Converse state via $tool dispatch (design.md D10, D14).
tools:
  # tpm words -- model-invoked
  - tpm_backlog_list
  - tpm_backlog_check

  # File words
  - read
  - write
  - edit
  - find
  - list_files

  # Model loop -- direct transition actions
  - invoke_llm
  - parse_response
  - report_parse_error
  - reset_history
  - nudge_reread

  # Completion -- emits TaskCompleted via parse_response
  - done
