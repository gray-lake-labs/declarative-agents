# The sprint-end workflow's tpm words, dispatched by the model in the Summarize state.
# Optional flags are parameters, never ${VAR} args: the loader drops an
# argument whose variable is unset, which corrupts the flag list (the GH-135
# pilot finding). A non-zero exit is tpm's refusal, fed back to the model
# (design.md D14).
unit: tpm-sprint-end-declarations
tools:
- name: tpm_sprint_end_facts
  type: exec
  binary: tpm
  args:
  - sprint-end
  - facts
  - --json
  visibility: external
  description: Gather the period's facts — the weeks' reports, the Sprint Goals and their stories, and the recommended release (srd038 R1).
  category: boundary
  parameters:
    type: object
    properties:
      project:
        type: string
        description: The repository the sprint-end issue is in.
        flag: --project
      reports:
        type: string
        description: A checkout of the reports repository.
        flag: --reports
      from:
        type: string
        description: The period's first week, YYYY-Www.
        flag: --from
      to:
        type: string
        description: The period's last week, YYYY-Www.
        flag: --to
      artifact:
        type: string
        description: The artifact the repository releases.
        flag: --artifact
      control:
        type: string
        description: Program repository holding control/policy.md.
        flag: --control
      dir:
        type: string
        description: The repository's checkout, for its release tags.
        flag: --dir
    required: [project, reports, from, to, artifact]
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: tpm sprint-end facts's JSON report.
    schema:
      type: string
  side_effects:
  - kind: external_api_call
    target: tracker
    description: Reads the reports and the tracker; writes nothing.
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: tpm's own policy governs what follows; the run reverses nothing.
  errors:
  - signal: CommandError
    condition: the tpm binary cannot be started
    message_shape: 'tpm_sprint_end_facts: <error>'
    state_after_failure: nothing ran in a process that did not start
  - signal: ToolFailed
    condition: tpm refuses the gathering and exits non-zero
    message_shape: <tpm's refusal reason, as printed>
    state_after_failure: the tracker and the checkout are as tpm's refusal left them

- name: tpm_sprint_end_stories
  type: exec
  binary: tpm
  args:
  - sprint-end
  - stories
  - --json
  visibility: external
  description: Record the done stories in the period's summary (srd038).
  category: boundary
  parameters:
    type: object
    properties:
      release:
        type: string
        description: The release whose summary records them.
        flag: --release
      done:
        type: string
        description: The done stories, project#story or a story id, comma-separated.
        flag: --done
      project:
        type: string
        description: The project a bare story id belongs to.
        flag: --project
      dir:
        type: string
        description: The sprint-end issue's worktree.
        flag: --dir
    required: [release]
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: tpm sprint-end stories's JSON report.
    schema:
      type: string
  side_effects:
  - kind: external_api_call
    target: tracker
    description: Writes the done stories into the summary in the worktree.
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: tpm's own policy governs what follows; the run reverses nothing.
  errors:
  - signal: CommandError
    condition: the tpm binary cannot be started
    message_shape: 'tpm_sprint_end_stories: <error>'
    state_after_failure: nothing ran in a process that did not start
  - signal: ToolFailed
    condition: tpm refuses the record and exits non-zero
    message_shape: <tpm's refusal reason, as printed>
    state_after_failure: the tracker and the checkout are as tpm's refusal left them

- name: tpm_issue_merge
  type: exec
  binary: tpm
  args:
  - issue
  - merge
  - --json
  visibility: external
  description: Deliver the sprint-end issue by the merge that closes it and the complete Sprint Goals (srd013 R5.5, srd038).
  category: boundary
  parameters:
    type: object
    properties:
      project:
        type: string
        description: Project path.
        flag: --project
      issue:
        type: integer
        description: Issue IID.
        flag: --issue
      closes:
        type: string
        description: Another issue the merge closes, project#iid.
        flag: --closes
      control:
        type: string
        description: Program repository holding control/ files.
        flag: --control
      dir:
        type: string
        description: The worktree holding the branch, where the audit runs.
        flag: --dir
    required: [project, issue]
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: tpm issue merge's JSON report.
    schema:
      type: string
  side_effects:
  - kind: external_api_call
    target: tracker
    description: Merges the branch, pushes the result, and closes the issues in the tracker.
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: tpm's own policy governs what follows; the run reverses nothing.
  errors:
  - signal: CommandError
    condition: the tpm binary cannot be started
    message_shape: 'tpm_issue_merge: <error>'
    state_after_failure: nothing ran in a process that did not start
  - signal: ToolFailed
    condition: tpm refuses the merge — a failed audit or a missing approval — and exits non-zero
    message_shape: <tpm's refusal reason, as printed>
    state_after_failure: the tracker and the checkout are as tpm's refusal left them

- name: tpm_release_gate
  type: exec
  binary: tpm
  args:
  - release
  - gate
  - --json
  visibility: external
  description: Run the release gate for the confirmed version (srd015, srd038 R6).
  category: boundary
  parameters:
    type: object
    properties:
      artifact:
        type: string
        description: Artifact a subsystem SRD declares.
        flag: --artifact
      version:
        type: string
        description: Candidate version.
        flag: --version
      issue:
        type: string
        description: Release issue as project#iid.
        flag: --issue
      control:
        type: string
        description: Program repository holding control/policy.md.
        flag: --control
      dir:
        type: string
        description: The artifact repository's local checkout.
        flag: --dir
    required: [artifact, version, issue]
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: tpm release gate's JSON report.
    schema:
      type: string
  side_effects:
  - kind: external_api_call
    target: tracker
    description: Runs the gates and records evidence events on the release issue.
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: tpm's own policy governs what follows; the run reverses nothing.
  errors:
  - signal: CommandError
    condition: the tpm binary cannot be started
    message_shape: 'tpm_release_gate: <error>'
    state_after_failure: nothing ran in a process that did not start
  - signal: ToolFailed
    condition: a gate fails or tpm refuses, exiting non-zero
    message_shape: <tpm's refusal reason, as printed>
    state_after_failure: the tracker and the checkout are as tpm's refusal left them

- name: tpm_release_tag
  type: exec
  binary: tpm
  args:
  - release
  - tag
  - --json
  visibility: external
  description: Tag the confirmed release once its gate passed (srd015, srd038 R6).
  category: boundary
  parameters:
    type: object
    properties:
      artifact:
        type: string
        description: Artifact a subsystem SRD declares.
        flag: --artifact
      version:
        type: string
        description: Candidate version.
        flag: --version
      issue:
        type: string
        description: Release issue as project#iid.
        flag: --issue
      control:
        type: string
        description: Program repository holding control/policy.md.
        flag: --control
      dir:
        type: string
        description: The artifact repository's local checkout.
        flag: --dir
    required: [artifact, version, issue]
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: tpm release tag's JSON report.
    schema:
      type: string
  side_effects:
  - kind: external_api_call
    target: tracker
    description: Pushes the release tag.
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: tpm's own policy governs what follows; the run reverses nothing.
  errors:
  - signal: CommandError
    condition: the tpm binary cannot be started
    message_shape: 'tpm_release_tag: <error>'
    state_after_failure: nothing ran in a process that did not start
  - signal: ToolFailed
    condition: tpm refuses the tag — no passing gate, or the version exists — and exits non-zero
    message_shape: <tpm's refusal reason, as printed>
    state_after_failure: the tracker and the checkout are as tpm's refusal left them
